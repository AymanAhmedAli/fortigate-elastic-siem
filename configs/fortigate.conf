input {
  udp {
    port => 5144
    tags => [ "fortigate" ]
  }
}

filter {
  if "fortigate" in [tags] {

    grok {
      match => { "message" => "%{SYSLOG5424PRI}%{GREEDYDATA:log_message}" }
    }

    kv {
      source => "log_message"
      field_split => " "
      value_split => "="
      trim_value => "\""
      trim_key => "\""
      remove_field => [ "log_message" ]
    }

        if [eventtime] {
      ruby {
        code => "
          et = event.get('eventtime').to_s
          event.set('event_epoch_ms', (et[0,13]).to_i) if et.length >= 13
        "
      }
      date {
        match => [ "event_epoch_ms", "UNIX_MS" ]
        target => "@timestamp"
        remove_field => [ "event_epoch_ms", "date", "time", "tz" ]
      }
    } else {
      mutate { add_field => { "fgt_timestamp" => "%{date} %{time}" } }
      date {
        match => [ "fgt_timestamp", "yyyy-MM-dd HH:mm:ss" ]
        timezone => "Etc/GMT-2"
        target => "@timestamp"
        remove_field => [ "fgt_timestamp", "date", "time" ]
      }
    }

    mutate {
      rename => {
        "srcip"    => "[source][ip]"
        "srcport"  => "[source][port]"
        "dstip"    => "[destination][ip]"
        "dstport"  => "[destination][port]"
        "service"  => "[network][protocol]"
        "sentbyte" => "[source][bytes]"
        "rcvdbyte" => "[destination][bytes]"
        "devname"  => "[observer][name]"
        "level"    => "[log][level]"
      }
      add_field => {
        "[observer][vendor]"  => "Fortinet"
        "[observer][product]" => "FortiGate"
        "[observer][type]"    => "firewall"
        "[event][kind]"       => "event"
      }
    }

    mutate {
      convert => {
        "[source][port]"       => "integer"
        "[destination][port]"  => "integer"
        "[source][bytes]"      => "integer"
        "[destination][bytes]" => "integer"
      }
    }

    if [type] == "traffic" {
      mutate { add_field => { "[event][category]" => "network" } }
      if [action] == "deny" or [action] == "blocked" {
        mutate { add_field => { "[event][outcome]" => "failure" } }
      } else {
        mutate { add_field => { "[event][outcome]" => "success" } }
      }
    }
    else if [type] == "utm" {
      if [subtype] == "ips" {
        mutate { add_field => { "[event][category]" => "intrusion_detection" } }
      } else if [subtype] == "webfilter" {
        mutate { add_field => { "[event][category]" => "web" } }
      } else if [subtype] == "virus" {
        mutate { add_field => { "[event][category]" => "malware" } }
      } else if [subtype] == "app-ctrl" {
        mutate { add_field => { "[event][category]" => "network" } }
      }
    }
    else if [type] == "event" {
      if [subtype] == "vpn" or [subtype] == "user" {
        mutate { add_field => { "[event][category]" => "authentication" } }
      } else {
        mutate { add_field => { "[event][category]" => "configuration" } }
      }
    }

    if [destination][ip] and [destination][ip] !~ /^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.|127\.)/ {
      geoip {
        source => "[destination][ip]"
        target => "[destination]"
      }
    }

    mutate {
      remove_field => [ "@version", "eventtime", "tz", "message" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "<ELASTIC_PASSWORD>"
    ssl_certificate_verification => false
    index => "fortigate-v2-%{+YYYY.MM.dd}"
  }
}
